<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="960" height="580" viewBox="0 0 960 580" version="1.1">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-stretch" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="960" height="580" fill="#FAFAF8" rx="0"/>

  <!-- ══════════════════════════════════════════
       COLUMN HEADER LABELS
  ══════════════════════════════════════════ -->
  <text x="100"  y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#888780" letter-spacing="1">INPUTS</text>
  <text x="300"  y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#888780" letter-spacing="1">PERCEPTION</text>
  <text x="520"  y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#888780" letter-spacing="1">SLAM</text>
  <text x="720"  y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#888780" letter-spacing="1">CONTROL</text>
  <text x="890"  y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#888780" letter-spacing="1">OUTPUTS</text>

  <!-- column dividers -->
  <line x1="195" y1="20" x2="195" y2="520" stroke="#E8E6E0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="410" y1="20" x2="410" y2="520" stroke="#E8E6E0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="630" y1="20" x2="630" y2="520" stroke="#E8E6E0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="820" y1="20" x2="820" y2="520" stroke="#E8E6E0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ══════════════════════════════════════════
       INPUT BOXES  (teal)
  ══════════════════════════════════════════ -->

  <!-- LiDAR -->
  <rect x="20" y="60" width="160" height="60" rx="8"
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#085041">LiDAR</text>
  <text x="100" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">/scan · LaserScan</text>

  <!-- Wheel Odometry -->
  <rect x="20" y="155" width="160" height="60" rx="8"
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#085041">Wheel odometry</text>
  <text x="100" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">/odom · Odometry</text>

  <!-- IMU (stretch – dashed) -->
  <rect x="20" y="250" width="160" height="60" rx="8"
        fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="100" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#444441">IMU  ✦</text>
  <text x="100" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">/imu · Imu</text>

  <!-- Teleop -->
  <rect x="20" y="345" width="160" height="60" rx="8"
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="100" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#085041">Teleop</text>
  <text x="100" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">/cmd_vel · Twist</text>

  <!-- ══════════════════════════════════════════
       PERCEPTION BOXES  (purple)
  ══════════════════════════════════════════ -->

  <!-- LiDAR Driver -->
  <rect x="215" y="60" width="175" height="60" rx="8"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="302" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#26215C">LiDAR driver</text>
  <text x="302" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">vendor pkg · off-the-shelf</text>

  <!-- TF Tree -->
  <rect x="215" y="155" width="175" height="60" rx="8"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="302" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#26215C">TF tree</text>
  <text x="302" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3C3489">map→odom→base→laser</text>

  <!-- IMU Filter (stretch – dashed) -->
  <rect x="215" y="250" width="175" height="60" rx="8"
        fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="302" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#444441">IMU filter  ✦</text>
  <text x="302" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">imu_filter_madgwick</text>

  <!-- ══════════════════════════════════════════
       SLAM BOX  (blue, tall – spans rows)
  ══════════════════════════════════════════ -->
  <rect x="430" y="100" width="180" height="175" rx="10"
        fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="520" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#042C53">SLAM node</text>
  <line x1="450" y1="180" x2="590" y2="180" stroke="#185FA5" stroke-width="0.75" stroke-dasharray="3 2"/>
  <text x="520" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">gmapping</text>
  <text x="520" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">— or —</text>
  <text x="520" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">cartographer_ros</text>
  <text x="520" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#378ADD">tune params</text>

  <!-- ══════════════════════════════════════════
       CONTROL BOXES  (coral)
  ══════════════════════════════════════════ -->

  <!-- map_saver -->
  <rect x="650" y="60" width="155" height="60" rx="8"
        fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="727" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4A1B0C">map_saver</text>
  <text x="727" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#712B13">off-the-shelf · configure</text>

  <!-- Motor Driver -->
  <rect x="650" y="345" width="155" height="60" rx="8"
        fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="727" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4A1B0C">Motor driver</text>
  <text x="727" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#712B13">vendor pkg · off-the-shelf</text>

  <!-- RViz -->
  <rect x="650" y="225" width="155" height="60" rx="8"
        fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="727" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4A1B0C">RViz</text>
  <text x="727" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#712B13">live visualisation</text>

  <!-- ══════════════════════════════════════════
       OUTPUT BOXES  (green)
  ══════════════════════════════════════════ -->

  <!-- Saved map -->
  <rect x="830" y="60" width="115" height="60" rx="8"
        fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="887" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173404">Saved map</text>
  <text x="887" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">room.pgm + room.yaml</text>

  <!-- Live map -->
  <rect x="830" y="225" width="115" height="60" rx="8"
        fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="887" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173404">Live map</text>
  <text x="887" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">/map · OccupancyGrid</text>

  <!-- Robot motion -->
  <rect x="830" y="345" width="115" height="60" rx="8"
        fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="887" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173404">Robot motion</text>
  <text x="887" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">Mecanum drive</text>

  <!-- ══════════════════════════════════════════
       ARROWS
  ══════════════════════════════════════════ -->

  <!-- LiDAR → LiDAR driver -->
  <line x1="180" y1="90" x2="213" y2="90" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Odometry → TF tree -->
  <line x1="180" y1="185" x2="213" y2="185" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- IMU → IMU filter (dashed) -->
  <line x1="180" y1="280" x2="213" y2="280" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-stretch)"/>

  <!-- LiDAR driver → SLAM -->
  <line x1="390" y1="90" x2="428" y2="150" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TF → SLAM -->
  <line x1="390" y1="185" x2="428" y2="185" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- IMU filter → SLAM (dashed) -->
  <line x1="390" y1="280" x2="428" y2="240" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-stretch)"/>

  <!-- SLAM → map_saver -->
  <line x1="610" y1="150" x2="648" y2="90" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SLAM → RViz -->
  <line x1="610" y1="200" x2="648" y2="255" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- map_saver → Saved map -->
  <line x1="805" y1="90" x2="828" y2="90" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RViz → Live map -->
  <line x1="805" y1="255" x2="828" y2="255" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Teleop → Motor driver (L-bend, stays below all boxes) -->
  <polyline points="180,375 205,375 205,450 640,450 640,375 648,375"
            fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Motor driver → Robot motion -->
  <line x1="805" y1="375" x2="828" y2="375" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════
       MEASUREMENT BADGES  (amber M)
  ══════════════════════════════════════════ -->

  <!-- M1: TF tree validity -->
  <circle cx="302" cy="148" r="10" fill="#BA7517"/>
  <text x="302" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAEEDA">M</text>

  <!-- M2: map update rate -->
  <circle cx="610" cy="188" r="10" fill="#BA7517"/>
  <text x="610" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAEEDA">M</text>

  <!-- M3: map coverage -->
  <circle cx="944" cy="83" r="10" fill="#BA7517"/>
  <text x="944" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FAEEDA">M</text>

  <!-- ══════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════ -->
  <line x1="20" y1="478" x2="940" y2="478" stroke="#D3D1C7" stroke-width="1"/>

  <!-- teal – sensor input -->
  <rect x="20" y="492" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="40" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">Sensor input</text>

  <!-- purple – off-the-shelf ROS pkg -->
  <rect x="140" y="492" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="160" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">Off-the-shelf (ROS pkg)</text>

  <!-- blue – slam -->
  <rect x="320" y="492" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="340" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">SLAM (tune params)</text>

  <!-- coral – configure/build -->
  <rect x="480" y="492" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="500" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">Configure / build</text>

  <!-- green – output -->
  <rect x="620" y="492" width="14" height="14" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="640" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">Output</text>

  <!-- gray dashed – stretch -->
  <rect x="700" y="492" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="720" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">✦ Stretch (IMU fusion)</text>

  <!-- amber M – measurement -->
  <circle cx="867" cy="499" r="8" fill="#BA7517"/>
  <text x="867" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FAEEDA">M</text>
  <text x="881" y="503" font-family="Arial, sans-serif" font-size="11" fill="#444441">Measurement point</text>

</svg>
