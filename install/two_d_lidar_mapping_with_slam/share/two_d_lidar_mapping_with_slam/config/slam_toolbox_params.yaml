# slam_toolbox_params.yaml
# Online async SLAM configuration for HiWonder JetRover + RPLidar A1
# ROS 2 Humble

slam_toolbox:
  ros__parameters:

    # --- Mode ---
    mode: mapping                  # We're building a map, not localizing in a known one

    # --- Frame configuration ---
    # These must match exactly what our TF tree publishes
    odom_frame: odom
    base_frame: base_footprint     # Footprint (2D projection) is standard for ground robots
    map_frame: map
    scan_topic: /scan

    # --- Solver / performance --- Commented out for now to keep it simple
    # solver_plugin: solver_plugins::CeresSolver   # Ceres is more stable than g2o for beginners
    # ceres_linear_solver: SPARSE_NORMAL_CHOLESKY  # Good balance of speed and accuracy for small maps
    # ceres_preconditioner: SCHUR_JACOBI           # Speeds up the linear solve step
    # ceres_trust_strategy: LEVENBERG_MARQUARDT    # Robust to noisy sensor data — suits the A1

    # --- Map update behavior ---
    resolution: 0.05               # 5 cm per cell — enough detail for indoor navigation without memory bloat
    max_laser_range: 10.0          # A1 is rated 12m but indoor quality degrades past ~10m; stay conservative
    minimum_travel_distance: 0.3   # Only update the map after moving 30cm — avoids spamming updates while stationary
    minimum_travel_heading: 0.3    # Same idea but for rotation, in radians (~17 degrees)
    map_update_interval: 5.0       # Seconds between full map saves to disk (not the live map — that updates continuously)

    # --- Loop closure --- Commented out for now to keep it simple
    # do_loop_closing: true          # Let SLAM correct accumulated drift when it recognizes a previously visited area
    # loop_search_maximum_distance: 3.0  # Only look for loop closure candidates within 3m — keeps it cheap on the Jetson
    # loop_match_minimum_response_coarse: 0.35   # Threshold for a "good enough" rough loop match
    # loop_match_minimum_response_fine: 0.45     # Higher bar for the refined match — avoids false closures

    # # --- Scan matching --- Commented out for now to keep it simple
    # use_scan_barycenter: true      # Match scans at their centroid — more stable than edge-based matching
    # minimum_time_interval: 0.5     # Minimum seconds between processed scans — throttles CPU load on the Jetson

    # --- Pose graph ---
    transform_publish_period: 0.02   # How often to publish map→odom transform (50 Hz) — keep smooth
    tf_buffer_duration: 30.0        # How long to keep TF history; 30s is safe for typical indoor sessions
